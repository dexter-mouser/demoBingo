<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Bingo · Jugador</title><link rel="stylesheet" href="estilos/style.css"></head><body><header></header>
<main>
<section class="pantalla entra" id="pantallaCodigo" hidden><h1>Entrar a una sala</h1><form class="formulario" id="formCodigo"><label>Código de sala<input id="campoCodigo" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="K7QF" required></label><p class="error" id="errorCodigo" role="alert"></p><button class="btn primario" data-ico="jugar">Continuar</button></form></section>
<section class="pantalla entra" id="pantallaTablas" hidden><h1>Elige tu tabla</h1><div class="catalogo" id="catalogo"></div><div id="vistaPrevia"></div><button class="btn primario" id="btnElegir" disabled data-ico="verificar">Jugar con esta tabla</button><button class="btn" id="btnOtroCodigo" data-ico="volver">Cambiar código</button></section>
<section class="pantalla entra" id="pantallaJuego" hidden><p>Sala <b id="salaJuego"></b> · Tabla <b id="tablaJuego"></b></p><div id="tablero"></div><button class="btn primario" id="btnPremio" disabled data-ico="verificar"><span>Cantar premio</span></button><button class="btn" id="btnCambiar" data-ico="volver">Cambiar de código</button></section>
<section class="pantalla entra" id="pantallaReclamo" hidden><h1>Muestra esto al anfitrión</h1><div class="panel"><p class="suave">Código de tabla</p><div class="gigante" id="reclamoTabla"></div><p class="suave">Premio</p><div class="gigante" id="reclamoPremio"></div></div><button class="btn" id="btnVolverTabla" data-ico="volver">Volver a mi tabla</button></section>
</main>
<script src="js/nucleo.js"></script><script src="js/interfaz.js"></script><script src="js/jugador.js"></script></body></html>
